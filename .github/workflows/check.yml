name: PI Registry — JS Syntax Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  syntax-check:
    name: Check JavaScript syntax in HTML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS syntax check on all HTML files
        run: |
          python3 - <<'PYEOF'
          import re, tempfile, subprocess, os, sys, glob

          HTML_FILES = glob.glob("*.html")
          if not HTML_FILES:
              print("No HTML files found — skipping.")
              sys.exit(0)

          all_clean = True

          for filepath in sorted(HTML_FILES):
              with open(filepath, encoding="utf-8") as f:
                  content = f.read()

              scripts = re.findall(
                  r'<script(?![^>]*\bsrc\b)[^>]*>(.*?)</script>',
                  content, re.DOTALL
              )

              file_errors = []
              for i, script in enumerate(scripts):
                  with tempfile.NamedTemporaryFile(
                      mode="w", suffix=".js", delete=False
                  ) as tmp:
                      tmp.write(script)
                      tmp_path = tmp.name

                  result = subprocess.run(
                      ["node", "--check", tmp_path],
                      capture_output=True, text=True
                  )
                  os.unlink(tmp_path)

                  if result.stderr:
                      file_errors.append(
                          f"  Script block {i + 1}:\n{result.stderr.strip()}"
                      )

              if file_errors:
                  all_clean = False
                  print(f"\n❌  {filepath} — {len(file_errors)} error(s):")
                  for err in file_errors:
                      print(err)
              else:
                  print(f"✅  {filepath} — clean ({len(scripts)} script block(s))")

          if not all_clean:
              print("\nSyntax errors found. Fix before merging.")
              sys.exit(1)
          else:
              print("\nAll files passed syntax check.")
          PYEOF
