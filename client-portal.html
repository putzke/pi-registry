<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon COMPASS — Client Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #1a1a2e; }

    /* ── Login ────────────────────────────────────────────────────────── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: #0B1929; }
    .login-card-wrap { width: 100%; max-width: 420px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 48px rgba(0,0,0,0.4); }
    .login-hero { background: #112236; padding: 40px 24px 32px; text-align: center; }
    .login-hero svg { display: block; margin: 0 auto; }
    .client-label { margin-top: 14px; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #A8C2D8; }
    .login-body { background: white; padding: 32px 36px 36px; }
    .login-body h2 { font-size: 19px; font-weight: 600; margin-bottom: 8px; }
    .login-body p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.55; }
    .login-body input[type="email"] { width: 100%; padding: 11px 14px; border: 1.5px solid #dde1ea; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 12px; transition: border-color 0.15s; font-family: inherit; }
    .login-body input[type="email"]:focus { border-color: #3b5bdb; }
    .btn-primary { width: 100%; padding: 12px; background: #3b5bdb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: inherit; }
    .btn-primary:hover { background: #2f4ac0; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    #login-msg { margin-top: 16px; font-size: 14px; text-align: center; line-height: 1.5; min-height: 20px; }
    #login-msg.success { color: #2e7d32; }
    #login-msg.error { color: #c62828; }

    /* ── App shell ────────────────────────────────────────────────────── */
    #app { display: none; height: 100%; flex-direction: column; }
    #app.visible { display: flex; }

    .topbar { flex-shrink: 0; background: #0B1929; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 200; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .tb-brand { display: flex; align-items: center; gap: 10px; line-height: 1; }
    .tb-logo  { flex-shrink: 0; }
    .tb-text  { display: flex; flex-direction: column; }
    .tb-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .tb-sub  { font-size: 9px; color: #A8C2D8; margin-top: 3px; text-transform: uppercase; letter-spacing: 1.4px; }
    .tb-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon-tb { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1.5px solid #2a4060; border-radius: 7px; background: transparent; color: #A8C2D8; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
    .btn-icon-tb svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn-icon-tb:hover { border-color: #A8C2D8; color: #fff; }
    .btn-signout { padding: 6px 14px; border: 1.5px solid #2a4060; border-radius: 7px; background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; color: #A8C2D8; font-family: inherit; transition: border-color 0.15s, color 0.15s; }
    .btn-signout:hover { border-color: #A8C2D8; color: #fff; }
    .shared-label { font-size: 11px; color: #A8C2D8; font-style: italic; padding: 0 4px; }

    /* ── Mobile chip strip ────────────────────────────────────────────── */
    .chip-strip { flex-shrink: 0; display: none; background: #fff; border-bottom: 1px solid #e8eaf0; overflow-x: auto; white-space: nowrap; padding: 10px 16px; gap: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chip-strip::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #e0e3ef; color: #555; background: #f8f9fc; transition: all 0.15s; white-space: nowrap; font-family: inherit; }
    .chip svg { width: 13px; height: 13px; }
    .chip.active { background: #3b5bdb; color: #fff; border-color: #3b5bdb; }
    .chip:hover:not(.active) { border-color: #b0b8d8; color: #333; }

    /* ── App layout ───────────────────────────────────────────────────── */
    .app-layout { flex: 1; display: flex; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────────────────── */
    .sidebar { width: 220px; flex-shrink: 0; background: #091525; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-proj { padding: 16px 16px 12px; border-bottom: 1px solid #162030; }
    .sidebar-proj-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #4d7a9e; margin-bottom: 6px; }
    .sidebar-proj-name { font-size: 13px; font-weight: 600; color: #d0e4f5; line-height: 1.3; }
    .proj-select { width: 100%; background: #112236; border: 1px solid #1e3a5f; border-radius: 6px; color: #d0e4f5; font-size: 13px; padding: 6px 8px; font-family: inherit; cursor: pointer; outline: none; }
    .proj-select:focus { border-color: #3b5bdb; }
    .nav-section { padding: 10px 0 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; color: #7a9ebb; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; transition: all 0.12s; user-select: none; }
    .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: #c0d8ef; }
    .nav-item.active { background: rgba(59,91,219,0.15); color: #fff; border-left-color: #3b5bdb; font-weight: 600; }
    .nav-badge { background: #3b5bdb; color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
    .nav-item .nav-badge { margin-left: auto; }
    .chip .nav-badge { min-width: 16px; height: 16px; }
    .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid #162030; }

    /* ── Content ──────────────────────────────────────────────────────── */
    .content { flex: 1; overflow-y: auto; background: #f5f6fa; }
    .content-inner { max-width: 860px; margin: 0 auto; padding: 28px 24px; }

    /* ── Section header ───────────────────────────────────────────────── */
    .section-header { margin-bottom: 24px; }
    .section-header h2 { font-size: 20px; font-weight: 700; color: #111827; }
    .section-header p  { font-size: 13px; color: #6b7280; margin-top: 4px; }

    /* ── Project banner ───────────────────────────────────────────────── */
    .proj-banner { background: white; border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid #3b5bdb; }
    .proj-banner h1 { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
    .proj-meta { display: flex; flex-wrap: wrap; gap: 16px 28px; }
    .proj-meta span { font-size: 13px; color: #6b7280; }
    .proj-meta strong { color: #374151; }

    /* ── Stat tiles ───────────────────────────────────────────────────── */
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-tile { background: white; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat-tile .stat-num { font-size: 28px; font-weight: 700; color: #111827; line-height: 1; margin-bottom: 6px; }
    .stat-tile .stat-lbl { font-size: 12px; color: #6b7280; font-weight: 500; }
    .stat-tile .stat-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .stat-tile.stat-blue .stat-num { color: #3b5bdb; }
    .stat-tile.stat-green .stat-num { color: #2e7d32; }
    .stat-tile.stat-amber .stat-num { color: #b45309; }

    /* ── Cards ────────────────────────────────────────────────────────── */
    .card { background: white; border-radius: 10px; padding: 22px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Tables ───────────────────────────────────────────────────────── */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; padding: 0 12px 10px 0; border-bottom: 1.5px solid #f3f4f6; white-space: nowrap; }
    td { padding: 12px 12px 12px 0; border-bottom: 1px solid #f9fafb; font-size: 13.5px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .col-main { font-weight: 500; }

    /* ── Badges ───────────────────────────────────────────────────────── */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .badge-green  { background: #dcfce7; color: #166534; }
    .badge-blue   { background: #dbeafe; color: #1d4ed8; }
    .badge-amber  { background: #fef3c7; color: #92400e; }
    .badge-gray   { background: #f3f4f6; color: #6b7280; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .prog-wrap { display: flex; align-items: center; gap: 8px; }
    .prog-bar  { background: #e5e7eb; border-radius: 4px; height: 6px; width: 72px; overflow: hidden; flex-shrink: 0; }
    .prog-fill { height: 100%; background: #3b5bdb; border-radius: 4px; }
    .prog-lbl  { font-size: 12px; color: #9ca3af; }

    /* ── Attention panel ─────────────────────────────────────────────── */
    .attention-panel { background: #fffbeb; border: 1px solid #fcd34d; border-left: 4px solid #f59e0b; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
    .attn-header { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #92400e; margin-bottom: 12px; }
    .attn-header svg { width: 15px; height: 15px; flex-shrink: 0; }
    .attn-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .attn-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #374151; line-height: 1.4; }
    .attn-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .attn-dot-amber { background: #f59e0b; }
    .attn-dot-red   { background: #ef4444; }
    .attn-dot-blue  { background: #3b5bdb; }
    .attn-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: #9ca3af; white-space: nowrap; padding-top: 1px; flex-shrink: 0; min-width: 80px; }

    /* ── Recent activity list ─────────────────────────────────────────── */
    .activity-list { list-style: none; }
    .activity-list li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .activity-list li:last-child { border-bottom: none; }
    .act-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .act-icon svg { width: 13px; height: 13px; }
    .act-icon.mtg { background: #dbeafe; color: #1d4ed8; }
    .act-icon.int { background: #dcfce7; color: #166534; }
    .act-body { flex: 1; min-width: 0; }
    .act-body strong { font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-body span { font-size: 12px; color: #9ca3af; }
    .act-note { font-size: 12px; color: #6b7280; margin-top: 3px; display: block; line-height: 1.45; }

    /* ── Upcoming list ────────────────────────────────────────────────── */
    .upcoming-list { list-style: none; }
    .upcoming-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; gap: 12px; }
    .upcoming-list li:last-child { border-bottom: none; }
    .upcoming-title { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upcoming-due { font-size: 12px; color: #9ca3af; white-space: nowrap; }
    .due-soon { color: #b45309; font-weight: 600; }

    /* ── Date range bar ───────────────────────────────────────────────── */
    .date-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; padding: 14px 16px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e5e7eb; }
    .date-bar label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; }
    .date-bar input[type="date"] { padding: 6px 10px; border: 1.5px solid #d1d5db; border-radius: 7px; font-size: 13px; font-family: inherit; color: #374151; outline: none; transition: border-color 0.15s; background: white; }
    .date-bar input[type="date"]:focus { border-color: #3b5bdb; }
    .btn-update { padding: 6px 16px; background: #3b5bdb; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-update:hover { background: #2f4ac0; }

    /* ── Activity subsection ──────────────────────────────────────────── */
    .sub-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: #9ca3af; margin: 20px 0 10px; padding-bottom: 8px; border-bottom: 1.5px solid #f3f4f6; }
    .sub-heading:first-child { margin-top: 0; }

    /* ── States ───────────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; }
    .loading-state { text-align: center; padding: 60px 20px; color: #9ca3af; font-size: 14px; }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 16px 18px; color: #991b1b; font-size: 13.5px; line-height: 1.5; margin-bottom: 16px; }
    .info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 14px 18px; color: #1e40af; font-size: 13.5px; line-height: 1.5; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
    .info-box-icon { flex-shrink: 0; margin-top: 1px; }

    /* ── Multi-project cards ──────────────────────────────────────────── */
    .proj-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .proj-card { background: white; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, box-shadow 0.15s; }
    .proj-card:hover { border-color: #3b5bdb; box-shadow: 0 2px 8px rgba(59,91,219,0.12); }
    .proj-card.pc-active { border-color: #3b5bdb; background: #f5f8ff; }
    .pc-name { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 4px; line-height: 1.35; }
    .pc-meta { font-size: 12px; color: #6b7280; margin-bottom: 10px; }
    .pc-prog { display: flex; align-items: center; gap: 8px; }
    .pc-bar  { flex: 1; background: #e5e7eb; border-radius: 4px; height: 5px; overflow: hidden; }
    .pc-fill { height: 100%; background: #3b5bdb; border-radius: 4px; }
    .pc-lbl  { font-size: 11px; color: #9ca3af; white-space: nowrap; }

    /* ── Mobile project bar ───────────────────────────────────────────── */
    .mob-proj-bar { display: none; background: #f0f2fa; border-bottom: 1px solid #e0e3ef; padding: 8px 16px; }
    .mob-proj-bar select { width: 100%; background: white; border: 1.5px solid #dde1ea; border-radius: 7px; color: #374151; font-size: 14px; padding: 8px 10px; font-family: inherit; cursor: pointer; outline: none; }
    .mob-proj-bar select:focus { border-color: #3b5bdb; }
    @media (max-width: 768px) { .mob-proj-bar.has-multi { display: block; } }

    /* ── Print ────────────────────────────────────────────────────────── */
    @media print {
      html, body { height: auto; overflow: auto; background: white; }
      #login-screen { display: none !important; }
      #app { display: block !important; height: auto; }
      .topbar, .mob-proj-bar, .chip-strip, .sidebar, .btn-print-label, .btn-icon-tb, .btn-signout, .btn-update, .proj-cards, .proj-select { display: none !important; }
      .date-bar { display: none !important; }
      .no-print { display: none !important; }
      .print-header { display: block !important; margin-bottom: 16px; }
      .sum-toggle { background: #f9fafb; }
      .sum-item { border-color: #d1d5db; }
      .app-layout { display: block; overflow: visible; }
      .content { overflow: visible; }
      .content-inner { padding: 0; max-width: none; }
      /* Strip shadows; DON'T set break-inside:avoid on .card — large cards can't
         fit on one page and the browser will leave a big gap trying to honor it */
      .card, .stat-tile, .proj-banner { box-shadow: none; border: 1px solid #e5e7eb; }
      /* Small self-contained elements: keep together */
      .proj-banner, .stat-tile { break-inside: avoid; }
      .stat-row { grid-template-columns: repeat(4, 1fr); break-inside: avoid; }
      /* Keep section / card headings glued to the content that follows */
      .card-title  { break-after: avoid; }
      .sub-heading { break-after: avoid; }
      /* Prevent mid-row page breaks in tables */
      thead { break-inside: avoid; break-after: avoid; }
      tr { break-inside: avoid; }
      /* Tighten card spacing for print */
      .card { margin-bottom: 12px; padding: 16px 20px; }
      .tbl-wrap { overflow-x: visible; }
    }

    /* ── AI Summary ───────────────────────────────────────────────────── */
    .sum-text { font-size: 14px; color: #374151; line-height: 1.75; white-space: pre-wrap; }
    .sum-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #6b7280; margin-bottom: 6px; }
    .sum-list { display: flex; flex-direction: column; gap: 4px; }
    .sum-item { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    .sum-toggle { width: 100%; text-align: left; background: #f9fafb; border: none; padding: 10px 14px; cursor: pointer; font-size: 13px; color: #374151; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sum-toggle:hover { background: #f3f4f6; }
    .sum-period { color: #6b7280; font-size: 12px; white-space: nowrap; }
    .sum-body { padding: 14px 16px; border-top: 1px solid #e5e7eb; }
    .print-header { display: none; }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      html, body { height: auto; }
      #app.visible { height: auto; min-height: 100vh; }
      .app-layout { overflow: visible; flex-direction: column; }
      .sidebar { display: none !important; }
      .chip-strip { display: flex; }
      .content { overflow: visible; flex: none; }
      .content-inner { padding: 16px; }
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .topbar { padding: 0 14px; }
      .btn-print-label { display: none; }
    }
    @media (max-width: 480px) {
      .stat-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .proj-meta { gap: 10px 20px; }
      td, th { padding-right: 8px; }
    }
  </style>
</head>
<body>

<!-- ── Login Screen ──────────────────────────────────────────────────── -->
<div id="login-screen">

// ── Date helpers ──────────────────────────────────────────────────────────────
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dfltFrom() { const d = new Date(); d.setDate(d.getDate()-30); return isoDate(d); }
function dfltTo()   { return isoDate(new Date()); }

// ── Session ───────────────────────────────────────────────────────────────────
// localStorage (not sessionStorage) so the login survives closing the browser —
// the client returns to the portal on the same device without re-clicking the
// email link. Token refresh below keeps it alive past the ~1h access-token life.
function saveSession(data) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch(_) {} }
function loadSession()     { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(_) { return null; } }
function clearSession()    { localStorage.removeItem(SESSION_KEY); }

// The email the current session is authenticated as (decoded from the JWT).
function _sessionEmail() {
  try {
    const s = loadSession();
    if (!s || !s.access_token) return '';
    const b = s.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return (JSON.parse(atob(b)).email) || '';
  } catch(_) { return ''; }
}

// Exchange the long-lived refresh token for a fresh access token.
async function refreshSession(refresh_token) {
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY },
      body: JSON.stringify({ refresh_token })
    });
    if (!r.ok) return null;
    const d = await r.json();
    if (!d.access_token) return null;
    const sess = {
      access_token: d.access_token,
      refresh_token: d.refresh_token || refresh_token,
      expires_at: d.expires_at || (Math.floor(Date.now()/1000) + (d.expires_in || 3600))
    };
    saveSession(sess);
    return sess;
  } catch(_) { return null; }
}

// Return a usable session, refreshing when the access token is expired/near expiry.
async function ensureSession() {
  let s = loadSession();
  if (!s || !s.access_token) return null;
  const now = Math.floor(Date.now() / 1000);
  if (s.expires_at && (s.expires_at - now) < 60) {
    if (!s.refresh_token) { clearSession(); return null; }
    s = await refreshSession(s.refresh_token);
    if (!s) { clearSession(); return null; }
  }
  return s;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (token) { _tokenMode = true; bootFromToken(token); return; }

  const hash = window.location.hash;
  if (hash && hash.includes('access_token=')) {
    const p = new URLSearchParams(hash.slice(1));
    const tok = p.get('access_token');
    if (tok) {
      const expIn = Number(p.get('expires_in')) || 3600;
      saveSession({
        access_token: tok,
        refresh_token: p.get('refresh_token'),
        expires_at: Number(p.get('expires_at')) || (Math.floor(Date.now()/1000) + expIn)
      });
      history.replaceState(null, '', window.location.pathname);
      bootApp(); return;
    }
  }
  const s = await ensureSession();
  if (s) { bootApp(); return; }
  showLogin();
});

// ── Login form ────────────────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email-input').value.trim();
  const btn = document.getElementById('login-btn');
  const msg = document.getElementById('login-msg');
  btn.disabled = true; btn.textContent = 'Sending…';
  msg.textContent = ''; msg.className = '';
  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/otp?redirect_to=${encodeURIComponent(PORTAL_URL)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY },
      body: JSON.stringify({ email, create_user: true })
    });
    if (res.ok) {
      msg.className = 'success';
      try { localStorage.setItem('hc_portal_last_email', email); } catch(_) {}
      msg.textContent = 'Login link sent — check your inbox and click the link to sign in.';
      btn.textContent = 'Sent ✓';
    } else {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.msg || err.error_description || `Error ${res.status}`);
    }
  } catch(err) {
    msg.className = 'error';
    msg.textContent = err.message || 'Something went wrong. Please try again.';
    btn.disabled = false; btn.textContent = 'Send login link';
  }
});

// ── Screen switching ──────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
  // Prefill the last email used on this device so re-login (esp. on a new
  // device the client only needs to do once) is a single click.
  try {
    const last = localStorage.getItem('hc_portal_last_email');
    const inp = document.getElementById('email-input');
    if (last && inp && !inp.value) inp.value = last;
  } catch(_) {}
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  _maybeShowBookmarkTip();
}
function signOut() { clearSession(); showLogin(); }

// One-time nudge (login path only): now that the session persists on this
// device, bookmarking means opening the portal goes straight in.
function _maybeShowBookmarkTip() {
  if (_tokenMode) return;
  try { if (localStorage.getItem('hc_portal_bookmark_tip') === 'dismissed') return; } catch(_) {}
  if (document.getElementById('bookmark-tip')) return;
  const el = document.createElement('div');
  el.id = 'bookmark-tip';
  el.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #dde1ea;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:92%;font-size:13px;color:#374151;line-height:1.4';
  el.innerHTML = '<span>💡 <strong>Bookmark this page</strong> — you\'ll stay signed in on this device, so next time just open the bookmark (no email link needed).</span>'
    + '<button onclick="dismissBookmarkTip()" style="flex-shrink:0;background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer">Got it</button>';
  document.body.appendChild(el);
}
function dismissBookmarkTip() {
  try { localStorage.setItem('hc_portal_bookmark_tip', 'dismissed'); } catch(_) {}
  const el = document.getElementById('bookmark-tip'); if (el) el.remove();
}

// ── API helpers ───────────────────────────────────────────────────────────────
function authHdrs() {
  const s = loadSession();
  return { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${s.access_token}`, 'Accept': 'application/json' };
}
function anonHdrs() {
  return { 'apikey': SUPA_KEY, 'Accept': 'application/json' };
}
async function sbFetch(path) {
  const headers = _tokenMode ? anonHdrs() : authHdrs();
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers });
  if (!_tokenMode && res.status === 401) { clearSession(); showLogin(); throw new Error('session_expired'); }
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || `API ${res.status}`); }
  return res.json();
}

// ── App boot ──────────────────────────────────────────────────────────────────
async function bootApp() {
  showApp();
  try {
    const access = await sbFetch('pi_client_access?select=project_id');
    if (!access.length) {
      setContent(_noAccessHTML());
      return;
    }
    const ids = access.map(r => r.project_id).join(',');
    const [projects, deliverables, clientSummaries, sharedReports] = await Promise.all([
      sbFetch(`pi_projects?id=in.(${ids})&select=id,name,pid,client,phase,status,start_date,end_date&order=name.asc`),
      sbFetch(`pi_deliverables?project_id=in.(${ids})&select=id,project_id,title,deliverable_type,status,progress,contracted_qty,delivered_count,due_date,milestone_end&order=due_date.asc.nullslast`),
      sbFetch(`pi_client_summaries?project_id=in.(${ids})&select=id,project_id,content_recent,content_full,period_start,period_end,published_at,published_by&order=published_at.desc`),
      sbFetch(`pi_report_archive?project_id=in.(${ids})&client_visible=eq.true&select=id,project_id,report_num,report_title,report_subtitle,period_start,period_end,overall_summary,sections,snapshot,archived_at&order=archived_at.desc`)
    ]);
    if (!projects.length) {
      setContent(_noAccessHTML());
      return;
    }
    _projects = projects;
    _deliverables = deliverables;
    _clientSummaries = clientSummaries;
    _sharedReports = sharedReports;
    _projId = projects[0].id;
    buildNav();
    setView('overview');
  } catch(err) {
    if (err.message !== 'session_expired') {
      setContent(`<div class="error-box">Unable to load your project data: <strong>${esc(err.message)}</strong><br>Please refresh, or <a href="#" onclick="signOut();return false;">sign in again</a>.</div>`);
    }
  }
}

// ── Token-based anonymous boot ────────────────────────────────────────────────
async function bootFromToken(token) {
  showApp();
  setTopbarMode(true);
  try {
    const rows = await sbFetch(`pi_portal_links?token=eq.${encodeURIComponent(token)}&select=project_id`);
    if (!rows.length) {
      setContent('<div class="error-box">This portal link is not valid or has been revoked. Please contact your project manager.</div>');
      return;
    }
    const projId = rows[0].project_id;
    const [projects, deliverables, clientSummaries, sharedReports] = await Promise.all([
      sbFetch(`pi_projects?id=eq.${projId}&select=id,name,pid,client,phase,status,start_date,end_date`),
      sbFetch(`pi_deliverables?project_id=eq.${projId}&select=id,project_id,title,deliverable_type,status,progress,contracted_qty,delivered_count,due_date,milestone_end&order=due_date.asc.nullslast`),
      sbFetch(`pi_client_summaries?project_id=eq.${projId}&select=id,project_id,content_recent,content_full,period_start,period_end,published_at,published_by&order=published_at.desc`),
      sbFetch(`pi_report_archive?project_id=eq.${projId}&client_visible=eq.true&select=id,project_id,report_num,report_title,report_subtitle,period_start,period_end,overall_summary,sections,snapshot,archived_at&order=archived_at.desc`)
    ]);
    if (!projects.length) {
      setContent('<div class="error-box">Project not found. Please contact your project manager.</div>');
      return;
    }
    _projects = projects;
    _deliverables = deliverables;
    _clientSummaries = clientSummaries;
    _sharedReports = sharedReports;
    _projId = projects[0].id;
    buildNav();
    setView('overview');
  } catch(err) {
    setContent(`<div class="error-box">Unable to load project data: <strong>${esc(err.message)}</strong></div>`);
  }
}

function setTopbarMode(isToken) {
  const btn = document.getElementById('btn-signout');
  const lbl = document.getElementById('shared-label');
  if (btn) btn.style.display = isToken ? 'none' : '';
  if (lbl) lbl.style.display = isToken ? '' : 'none';
}

// ── Nav shell ─────────────────────────────────────────────────────────────────
function buildNav() {
  const sb  = document.getElementById('sidebar');
  const cs  = document.getElementById('chip-strip');
  const mpb = document.getElementById('mob-proj-bar');

  // Sidebar project selector
  const projHtml = _projects.length === 1
    ? `<div class="sidebar-proj-label">Project</div><div class="sidebar-proj-name">${esc(_projects[0].name)}</div>`
    : `<div class="sidebar-proj-label">Project</div>
       <select id="sb-proj-select" class="proj-select" onchange="switchProject(this.value)">
         ${_projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
       </select>`;

  sb.innerHTML = `
    <div class="sidebar-proj">${projHtml}</div>
    <div class="nav-section">
      ${NAV.map(n => `<div class="nav-item" id="nav-${n.id}" data-view="${n.id}" onclick="setView('${n.id}')">${n.icon}${esc(n.label)}${n.id==='summary'?'<span class="nav-badge" id="nav-badge-summary" style="display:none"></span>':''}</div>`).join('')}
    </div>`;

  cs.innerHTML = NAV.map(n =>
    `<button class="chip" id="chip-${n.id}" onclick="setView('${n.id}')">${n.icon}${esc(n.label)}${n.id==='summary'?'<span class="nav-badge" id="chip-badge-summary" style="display:none"></span>':''}</button>`
  ).join('');

  updateNavBadge();

  // Mobile project bar — only shown when 2+ projects
  if (mpb) {
    if (_projects.length > 1) {
      mpb.innerHTML = `<select id="mob-proj-select" onchange="switchProject(this.value)">
        ${_projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </select>`;
      mpb.classList.add('has-multi');
    } else {
      mpb.innerHTML = '';
      mpb.classList.remove('has-multi');
    }
  }
}

function setView(view) {
  _view = view;
  NAV.forEach(n => {
    document.getElementById(`nav-${n.id}`)?.classList.toggle('active', n.id === view);
    document.getElementById(`chip-${n.id}`)?.classList.toggle('active', n.id === view);
  });
  // Scroll active chip into view on mobile
  const chip = document.getElementById(`chip-${view}`);
  chip?.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
  renderSection(view);
}

function switchProject(id) {
  _projId = Number(id);
  ['sb-proj-select','mob-proj-select'].forEach(sid => {
    const el = document.getElementById(sid);
    if (el) el.value = String(id);
  });
  updateNavBadge();
  renderSection(_view);
}

// Shared-reports count badge on the Project Updates nav item / chip.
function updateNavBadge() {
  const c = _sharedReports.filter(r => String(r.project_id) === String(_projId)).length;
  ['nav-badge-summary','chip-badge-summary'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = c; el.style.display = c > 0 ? '' : 'none'; }
  });
}

function setContent(html) {
  document.getElementById('content').innerHTML = `<div class="content-inner">${html}</div>`;
}

// ── Project banner (reused across sections) ───────────────────────────────────
function projBanner() {
  const p = _projects.find(x => x.id === _projId);
  if (!p) return '';
  const meta = [
    p.pid        ? `<span><strong>Project #</strong> ${esc(p.pid)}</span>` : '',
    p.client     ? `<span><strong>Client</strong> ${esc(p.client)}</span>` : '',
    p.phase      ? `<span><strong>Phase</strong> ${esc(p.phase)}</span>` : '',
    p.status     ? `<span><strong>Status</strong> ${esc(p.status)}</span>` : '',
    p.start_date ? `<span><strong>Start</strong> ${fmt(p.start_date)}</span>` : '',
    p.end_date   ? `<span><strong>End</strong> ${fmt(p.end_date)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="proj-banner"><h1>${esc(p.name || 'Project')}</h1><div class="proj-meta">${meta}</div></div>`;
}

// ── Multi-project cards grid (for Overview) ───────────────────────────────────
function projCardsGrid() {
  if (_projects.length < 2) return '';
  return `<div class="proj-cards">${_projects.map(p => {
    const devs  = _deliverables.filter(d => String(d.project_id) === String(p.id));
    const total = devs.length;
    const done  = devs.filter(d => isComplete(d.status)).length;
    const pct   = total ? Math.round(done / total * 100) : 0;
    const active = p.id === _projId;
    const meta   = [p.client, p.phase].filter(Boolean).join(' · ');
    return `<div class="proj-card${active ? ' pc-active' : ''}" onclick="switchProject(${p.id})">
      <div class="pc-name">${esc(p.name)}</div>
      ${meta ? `<div class="pc-meta">${esc(meta)}</div>` : ''}
      <div class="pc-prog">
        <div class="pc-bar"><div class="pc-fill" style="width:${pct}%"></div></div>
        <span class="pc-lbl">${done}/${total} deliverables</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── Multi-project selector for content area (non-overview sections) ───────────
function projSelector() {
  if (_projects.length < 2) return '';
  return `<div style="margin-bottom:16px">
    <select class="proj-select" style="background:#f0f2fa;border-color:#dde1ea;color:#374151;font-size:14px;padding:8px 10px;border-radius:8px;width:auto;max-width:100%" onchange="switchProject(this.value)">
      ${_projects.map(p => `<option value="${p.id}"${p.id===_projId?' selected':''}>${esc(p.name)}</option>`).join('')}
    </select>
  </div>`;
}

// ── Info message (soft blue, for non-critical unavailable sections) ────────────
function infoMsg(text) {
  const icon = `<svg class="info-box-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="5.5" x2="8" y2="5.5" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="8" x2="8" y2="11" stroke-linecap="round"/></svg>`;
  return `<div class="info-box">${icon}${esc(text)}</div>`;
}

// ── Section dispatcher ────────────────────────────────────────────────────────
function renderSection(view) {
  switch(view) {
    case 'overview':     renderOverview();     break;
    case 'deliverables': renderDeliverables(); break;
    case 'activity':     renderActivity();     break;
    case 'issues':       renderIssues();       break;
    case 'commitments':  renderCommitments();  break;
    case 'comments':     renderComments();     break;
    case 'summary':      renderSummary();      break;
  }
}

// ── Overview ──────────────────────────────────────────────────────────────────
async function renderOverview() {
  const projDevs = _deliverables.filter(d => String(d.project_id) === String(_projId));
  const totalD = projDevs.length;
  const doneD  = projDevs.filter(d => isComplete(d.status)).length;
  const pctD   = totalD ? Math.round(doneD / totalD * 100) : 0;

  const today = isoDate(new Date());
  const upcoming = projDevs
    .filter(d => !isComplete(d.status) && (d.due_date || d.milestone_end))
    .sort((a,b) => (a.due_date||a.milestone_end) < (b.due_date||b.milestone_end) ? -1 : 1)
    .slice(0, 5);

  setContent(`${projCardsGrid()}${projBanner()}
    <div id="ov-attention"></div>
    <div class="stat-row">
      <div class="stat-tile stat-blue">
        <div class="stat-num">${doneD}/${totalD}</div>
        <div class="stat-lbl">Deliverables Complete</div>
        <div class="stat-sub">${pctD}% overall</div>
      </div>
      <div class="stat-tile" id="tile-issues"><div class="stat-num">—</div><div class="stat-lbl">Open Issues</div></div>
      <div class="stat-tile" id="tile-meetings"><div class="stat-num">—</div><div class="stat-lbl">Recent Events</div></div>
      <div class="stat-tile" id="tile-outreach"><div class="stat-num">—</div><div class="stat-lbl">Outreach Events</div></div>
    </div>
    <div class="card">
      <div class="card-title">Upcoming Deadlines</div>
      ${upcoming.length ? `<ul class="upcoming-list">${upcoming.map(d => {
        const due = d.due_date || d.milestone_end;
        const daysLeft = Math.ceil((new Date(due+'T12:00:00') - new Date()) / 86400000);
        const dueCls = daysLeft <= 14 ? ' due-soon' : '';
        return `<li>
          <span class="upcoming-title">${esc(d.title||d.deliverable_type||'—')}</span>
          ${statusBadge(d.status)}
          <span class="upcoming-due${dueCls}">${fmt(due)}</span>
        </li>`;
      }).join('')}</ul>`
      : '<div class="empty-state">No upcoming deadlines.</div>'}
    </div>
    <div class="card" id="ov-activity"><div class="loading-state" style="padding:24px">Loading recent activity&hellip;</div></div>`);

  // Fetch stats + recent activity + attention items in parallel
  try {
    const [issues, meetings, interactions, commitments, commentPeriods] = await Promise.all([
      sbFetch(`pi_issues?project_id=eq.${_projId}&select=id,status,title,priority`),
      sbFetch(`pi_meetings?project_id=eq.${_projId}&select=id,meeting_date,title,meeting_type&order=meeting_date.desc&limit=5`),
      sbFetch(`pi_interactions?project_id=eq.${_projId}&select=id,interaction_date,channel,subject,summary&order=interaction_date.desc&limit=5`),
      sbFetch(`pi_commitments?project_id=eq.${_projId}&select=id,commitment,due_date,status`),
      sbFetch(`pi_comment_periods?project_id=eq.${_projId}&select=id,title,status,end_date`)
    ]);
    const openIssues = issues.filter(i => isIssueOpen(i.status)).length;

    const t = id => document.getElementById(id);
    if (t('tile-issues'))   t('tile-issues').innerHTML   = `<div class="stat-num${openIssues > 0 ? ' ' : ''}" style="${openIssues>0?'color:#b45309':''}">${openIssues}</div><div class="stat-lbl">Open Issues</div>`;
    if (t('tile-meetings'))  t('tile-meetings').innerHTML  = `<div class="stat-num">${meetings.length}</div><div class="stat-lbl">Recent Events</div>`;
    if (t('tile-outreach'))  t('tile-outreach').innerHTML  = `<div class="stat-num">${interactions.length}</div><div class="stat-lbl">Recent Outreach</div>`;

    // ── Needs Attention panel ───────────────────────────────────────────
    const today = isoDate(new Date());
    const in14  = isoDate(new Date(Date.now() + 14*86400000));
    const attnItems = [];

    issues.filter(i => isIssueOpen(i.status) && i.priority && /high|critical/i.test(i.priority))
      .forEach(i => attnItems.push({ dot: 'amber', tag: 'Issue', text: i.title || 'Untitled issue' }));

    commitments.filter(c => !isComplete(c.status) && c.due_date && c.due_date < today)
      .forEach(c => attnItems.push({ dot: 'red', tag: 'Commitment', text: clip(c.commitment || 'Untitled commitment', 90) + ' — past due' }));

    commentPeriods.filter(p => {
        const sl = (p.status||'').toLowerCase();
        return (sl.includes('open')||sl.includes('active')) && p.end_date && p.end_date >= today && p.end_date <= in14;
      })
      .forEach(p => attnItems.push({ dot: 'blue', tag: 'Comment Period', text: `"${p.title || 'Untitled'}" closes ${fmt(p.end_date)}` }));

    const attnEl = t('ov-attention');
    if (attnEl && attnItems.length) {
      const warnIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1L1.5 13.5h13L8 1z"/><line x1="8" y1="6" x2="8" y2="9.5"/><circle cx="8" cy="11.5" r="0.6" fill="currentColor" stroke="none"/></svg>';
      attnEl.innerHTML = `<div class="attention-panel">
        <div class="attn-header">${warnIcon} Heads Up</div>
        <ul class="attn-list">${attnItems.map(a => `
          <li class="attn-item">
            <div class="attn-dot attn-dot-${a.dot}"></div>
            <span class="attn-tag">${esc(a.tag)}</span>
            <span>${esc(a.text)}</span>
          </li>`).join('')}
        </ul>
      </div>`;
    }

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(d) {
  if (!d) return '—';
  const dt = new Date(d+'T12:00:00');
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function clip(s, n=120) {
  s = String(s??'').trim();
  return s.length > n ? s.slice(0, n).trimEnd() + '…' : s;
}

// "Is this finished?" — used for deliverable/commitment progress AND for the
// Overview's open-issue count and Needs Attention panel.
//
// Must recognise every terminal status the app can write, or a finished item is
// reported as outstanding to the client. Issue statuses are
// Open / In Progress / Resolved / Monitoring (ISSUE_STATUSES in index.html), so
// 'resolv*' has to count as complete — without it a Resolved issue showed a green
// "Resolved" badge on the Issues tab (issueBadge knows the word) while the
// Overview still counted it as an Open Issue and raised a "Heads Up" panel.
// 'Monitoring' is deliberately NOT terminal — it's still being watched.
function isComplete(s) {
  if (!s) return false;
  const sl = s.toLowerCase();
  return sl.includes('complet') || sl.includes('resolv')
      || sl === 'done' || sl === 'closed' || sl === 'fulfilled';
}

function statusBadge(s) {
  if (!s) return '<span class="badge badge-gray">—</span>';
  const sl = s.toLowerCase();
  if (isComplete(sl))                                        return `<span class="badge badge-green">${esc(s)}</span>`;
  if (sl.includes('progress')||sl==='active'||sl.includes('review')) return `<span class="badge badge-blue">${esc(s)}</span>`;
  if (sl.includes('hold')||sl.includes('delay')||sl.includes('pend')) return `<span class="badge badge-amber">${esc(s)}</span>`;
  return `<span class="badge badge-gray">${esc(s)}</span>`;
}

// Is an issue still outstanding? Mirrors the desktop app exactly, which counts
// open issues with the allow-list status === 'Open' || 'In Progress'
// (ISSUE_STATUSES is Open / In Progress / Resolved / Monitoring). Using an
// allow-list rather than "not complete" keeps 'Monitoring' out of the client's
// open count the same way the desktop does, and means a new status can never
// silently start alarming clients.
function isIssueOpen(s) {
  const sl = (s||'').trim().toLowerCase();
  return sl === 'open' || sl === 'in progress';
}

function issueBadge(s) {
  if (!s) return '<span class="badge badge-gray">—</span>';
  const sl = s.toLowerCase();
  if (sl.includes('resolv')||sl.includes('closed')||sl.includes('done')) return `<span class="badge badge-green">${esc(s)}</span>`;
  if (sl.includes('open')||sl.includes('active')) return `<span class="badge badge-amber">${esc(s)}</span>`;
  if (sl.includes('progress')) return `<span class="badge badge-blue">${esc(s)}</span>`;
  return `<span class="badge badge-gray">${esc(s)}</span>`;
}

function commBadge(s) {
  if (!s) return '<span class="badge badge-gray">—</span>';
  const sl = s.toLowerCase();
  if (sl.includes('fulfill')||sl.includes('complet')||sl.includes('done')) return `<span class="badge badge-green">${esc(s)}</span>`;
  if (sl.includes('pending')||sl.includes('open')) return `<span class="badge badge-blue">${esc(s)}</span>`;
  if (sl.includes('overdue')) return `<span class="badge badge-red">${esc(s)}</span>`;
  return `<span class="badge badge-gray">${esc(s)}</span>`;
}

function commentPeriodBadge(s) {
  if (!s) return '<span class="badge badge-gray">—</span>';
  const sl = s.toLowerCase();
  if (sl.includes('open')||sl.includes('active')) return `<span class="badge badge-blue">${esc(s)}</span>`;
  if (sl.includes('closed')||sl.includes('complet')) return `<span class="badge badge-gray">${esc(s)}</span>`;
  if (sl.includes('schedul')||sl.includes('upcoming')) return `<span class="badge badge-amber">${esc(s)}</span>`;
  return `<span class="badge badge-gray">${esc(s)}</span>`;
}

function tribalBadge(s) {
  if (!s) return '<span class="badge badge-gray">—</span>';
  const sl = s.toLowerCase();
  if (sl.includes('respond')||sl.includes('complet')) return `<span class="badge badge-green">${esc(s)}</span>`;
  if (sl.includes('no response')||sl.includes('no_response')) return `<span class="badge badge-gray">No Response</span>`;
  if (sl.includes('pending')||sl.includes('await')) return `<span class="badge badge-amber">${esc(s)}</span>`;
  if (sl.includes('consult')) return `<span class="badge badge-blue">${esc(s)}</span>`;
  return `<span class="badge badge-gray">${esc(s)}</span>`;
}

// Percent complete. Mirrors the desktop report table (_buildSectionPreviewTable,
// 'auto-del'): when a contracted quantity is tracked, progress is delivered/
// contracted; otherwise fall back to the manual progress field. Without this the
// portal showed 0% for deliverables the report showed as 100% (e.g. 1 of 1
// delivered but no manual progress value set).
function progCell(d) {
  const contracted = parseInt(d.contracted_qty, 10);
  let pct;
  if (!isNaN(contracted) && contracted > 0) {
    pct = Math.min(100, Math.round((parseInt(d.delivered_count, 10) || 0) / contracted * 100));
  } else {
    pct = parseInt(d.progress, 10);
  }
  if (!isNaN(pct)) {
    return `<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${Math.min(100,Math.max(0,pct))}%"></div></div><span class="prog-lbl">${pct}%</span></div>`;
  }
  return d.progress ? esc(String(d.progress)) : '—';
}

// ── Project Updates (current trend + trend history + shared reports) ────────────
function renderSummary() {
  const trends = _clientSummaries.filter(s => String(s.project_id) === String(_projId))
    .sort((a,b) => (a.published_at||'') > (b.published_at||'') ? -1 : 1);
  const current = trends[0];
  const reports = _sharedReports.filter(r => String(r.project_id) === String(_projId))
    .sort((a,b) => (a.archived_at||'') > (b.archived_at||'') ? -1 : 1);

  // ── Current trend ──
  let trendHtml;
  if (current) {
    const pl = (current.period_start||current.period_end) ? `${fmt(current.period_start)} – ${fmt(current.period_end)}` : '';
    const pd = fmt(current.published_at ? current.published_at.slice(0,10) : '');
    const pubBy = current.published_by ? `Published by ${esc(current.published_by)}` : 'Published';
    trendHtml = `<div class="card">
      <div class="card-title">Project Status ${pl ? `<span style="font-size:12px;font-weight:400;color:#9ca3af">(${pl})</span>` : ''}</div>
      <div style="font-size:12px;color:#9ca3af;margin-bottom:10px">${pubBy} · ${pd}</div>
      <div class="sum-text">${esc(current.content_full || '—')}</div>
    </div>`;
  } else {
    trendHtml = `<div class="card">
      <div class="card-title">Project Status</div>
      <div class="empty-state">No project status update has been published yet. Your project manager will publish one soon.</div>
    </div>`;
  }

  // ── Trend history ──
  let histHtml = '';
  if (trends.length > 1) {
    const items = trends.slice(1).map((s, i) => {
      const pl = (s.period_start||s.period_end) ? `${fmt(s.period_start)} – ${fmt(s.period_end)}` : '';
      const pd = fmt(s.published_at ? s.published_at.slice(0,10) : '');
      return `<div class="sum-item">
        <button class="sum-toggle" onclick="var b=document.getElementById('trend-hist-${i}');b.style.display=b.style.display==='none'?'block':'none'">
          <span>${pd}${s.published_by ? ' · ' + esc(s.published_by) : ''}</span>
          <span class="sum-period">${pl}</span>
        </button>
        <div id="trend-hist-${i}" style="display:none" class="sum-body">
          <div class="sum-text">${esc(s.content_full || '—')}</div>
        </div>
      </div>`;
    }).join('');
    histHtml = `<div class="card" style="margin-top:16px">
      <div class="card-title">Previous Trend Updates</div>
      <div class="sum-list">${items}</div>
    </div>`;
  }

  // ── Shared reports ──
  let reportsHtml;
  if (reports.length) {
    const items = reports.map((r, i) => {
      const pl = (r.period_start||r.period_end) ? `${fmt(r.period_start)} – ${fmt(r.period_end)}` : 'No period set';
      const ad = fmt(r.archived_at ? r.archived_at.slice(0,10) : '');
      const title = esc(r.report_title||'PI Report') + (r.report_num ? ` <span style="color:#9ca3af;font-weight:400">#${esc(String(r.report_num))}</span>` : '');
      return `<div style="border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:#fafbfc">
          <div style="min-width:0">
            <div style="font-size:14px;font-weight:600;color:#111827">${title}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:2px">${pl} &middot; shared ${ad}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button onclick="var b=document.getElementById('rpt-body-${i}');b.style.display=b.style.display==='none'?'block':'none'" style="padding:6px 12px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#374151;font-size:12px;font-weight:500;cursor:pointer">View</button>
            <button onclick="printSharedReport('${r.id}')" style="padding:6px 12px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#374151;font-size:12px;font-weight:500;cursor:pointer">Print / PDF</button>
          </div>
        </div>
        <div id="rpt-body-${i}" style="display:none;padding:16px 18px;border-top:1px solid #e5e7eb">${renderArchivedReportHTML(r)}</div>
      </div>`;
    }).join('');
    reportsHtml = `<div class="card" style="margin-top:16px">
      <div class="card-title">Shared Reports <span style="font-size:12px;font-weight:400;color:#9ca3af">(${reports.length})</span></div>
      <div style="margin-top:6px">${items}</div>
    </div>`;
  } else {
    reportsHtml = `<div class="card" style="margin-top:16px">
      <div class="card-title">Shared Reports</div>
      <div class="empty-state">No reports have been shared yet. Your project manager shares individual PI reports here as they're produced.</div>
    </div>`;
  }

  setContent(`${projSelector()}${projBanner()}${trendHtml}${histHtml}${reportsHtml}`);
}

// Render an archived PI report's sections as read-only HTML (light theme).
// Mirrors the desktop _buildArchivedPreviewHTML: per-section narrative summaries;
// auto-data sections point the client to the live tabs for current detail.
// Render a shared report from its FROZEN snapshot (captured by the desktop app at
// archive time — see _buildReportSnapshot in index.html): distribution list,
// per-section counts line, and the data tables exactly as they were when archived.
// The snapshot's table markup is inline-styled and self-contained, so it renders
// identically here without duplicating the desktop CSS.
//
// Reports archived before snapshots existed (snapshot == null) fall back to
// narrative-only — their table data was never captured. We deliberately do NOT
// recompute from current project data: an archived report is a point-in-time
// record and must keep matching the copy the client already received.
function renderArchivedReportHTML(rec) {
  const snap = rec.snapshot || null;
  const sections = (snap && snap.sections && snap.sections.length) ? snap.sections : (rec.sections || []);
  let html = '';
  if ((rec.report_subtitle||'').trim()) {
    html += `<div style="font-size:13px;color:#4b5563;margin-bottom:10px">${esc(rec.report_subtitle)}</div>`;
  }
  if (snap && snap.recipients && snap.recipients.length) {
    html += `<div style="background:#e8eef4;border:1px solid #b0c4d8;border-radius:6px;padding:9px 13px;margin-bottom:14px;font-size:12px">`
      + `<span style="font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.4px;font-size:10px">Distributed to: </span>`
      + `<span style="color:#111">${snap.recipients.map(esc).join(', ')}</span></div>`;
  }
  if ((rec.overall_summary||'').trim()) {
    html += `<div style="background:#f0f4f8;border-left:3px solid #4a9be8;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#222;line-height:1.6">${esc(rec.overall_summary)}</div>`;
  }
  sections.forEach(sec => {
    const isAuto = sec.type && sec.type !== 'manual';
    html += `<div style="margin-bottom:18px">`;
    html += `<div style="font-size:13px;font-weight:700;color:#1e3a5f;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #cdd4dc;padding-bottom:4px;margin-bottom:8px">${esc(sec.title||'')}</div>`;
    if (!isAuto && sec.content) {
      html += '<ul style="margin:0 0 6px 0;padding-left:18px">';
      String(sec.content).split('\n').forEach(line => { if (line.trim()) html += `<li style="margin-bottom:4px;font-size:13px;color:#222">${esc(line.trim())}</li>`; });
      html += '</ul>';
    }
    // Narrative first — it introduces the data block that follows.
    if (sec.summary) {
      html += `<div style="font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap;margin-bottom:8px">${esc(sec.summary)}</div>`;
    } else if (isAuto && !sec.tableHtml) {
      html += `<div style="font-size:12px;color:#9ca3af;font-style:italic">See the Engagement, Deliverables, and Issues tabs for current detail on this section.</div>`;
    }
    if (isAuto && sec.countsLabel) {
      html += `<div style="font-size:11px;color:#595959;font-style:italic;background:#f0f0f0;border-radius:4px;padding:5px 10px;margin-bottom:8px">${esc(sec.countsLabel)}</div>`;
    }
    if (isAuto && sec.tableHtml) {
      html += `<div style="overflow-x:auto">${sec.tableHtml}</div>`;   // frozen table markup
    }
    html += `</div>`;
  });
  if (!sections.length) html += `<div style="color:#9ca3af;font-style:italic;padding:12px 0">This report has no sections.</div>`;
  return html;
}

// Open a clean print window for a single shared report (the v1 "download").
function printSharedReport(archiveId) {
  const rec = _sharedReports.find(r => String(r.id) === String(archiveId));
  if (!rec) return;
  const proj = _projects.find(p => p.id === _projId) || {};
  const pl = (rec.period_start||rec.period_end) ? `${fmt(rec.period_start)} – ${fmt(rec.period_end)}` : '';
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups to print or save this report as a PDF.'); return; }
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(rec.report_title||'PI Report')}</title>
    <style>
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1a1a2e;max-width:760px;margin:24px auto;padding:0 24px;line-height:1.5}
      h1{font-size:20px;color:#1e3a5f;margin:0 0 4px}
      .meta{font-size:12px;color:#666;margin-bottom:20px;border-bottom:3px solid #1e3a5f;padding-bottom:12px}
      ul{margin:0 0 6px 0;padding-left:18px}
    </style></head><body>
    <h1>${esc(rec.report_title||'PI Report')}${rec.report_num ? ' #'+esc(String(rec.report_num)) : ''}</h1>
    <div class="meta">${proj.pid ? 'PIN # '+esc(proj.pid)+(proj.name ? ' &middot; ' : '') : ''}${esc(proj.name||'')}${pl ? ' &middot; '+esc(pl) : ''}</div>
    ${renderArchivedReportHTML(rec)}
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 350);
}
</script>
</body>
</html>
